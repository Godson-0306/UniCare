services:
  - type: keyvalue
    name: unicare-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: unicare-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "False"
      - key: SEED_DEMO_ON_BOOT
        value: "true"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,unicare-backend.onrender.com,unicare-backend-r7y5.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://unicare-frontend-axyh.onrender.com,https://frontend-henna-ten-69.vercel.app,https://frontend-godson-0306s-projects.vercel.app,https://frontend-godson-0306-godson-0306s-projects.vercel.app"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://unicare-frontend-axyh.onrender.com,https://frontend-henna-ten-69.vercel.app,https://frontend-godson-0306s-projects.vercel.app,https://frontend-godson-0306-godson-0306s-projects.vercel.app"
      - key: FRONTEND_URL
        value: "https://unicare-frontend-axyh.onrender.com"
      - key: HOSPITAL_NETWORK_ENFORCEMENT
        value: "False"
      - key: HOSPITAL_ALLOWED_IP_RANGES
        value: "0.0.0.0/0,::/0"
      - key: HOSPITAL_ACCESS_SECRET
        value: "085ceb8068750bccf73e8f76c71ef7de59092dada1f5f823"
      - key: DATABASE_URL
        fromDatabase:
          name: unicare-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: unicare-redis
          property: connectionString
      - key: CHANNEL_LAYERS_REDIS_URL
        fromService:
          type: keyvalue
          name: unicare-redis
          property: connectionString

  - type: web
    name: unicare-frontend
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd frontend && npm ci && npm run build
    startCommand: cd frontend && npx next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BACKEND_INTERNAL_URL
        value: https://unicare-backend-r7y5.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: /api/v1
      - key: NEXT_PUBLIC_WS_URL
        value: wss://unicare-backend-r7y5.onrender.com
      - key: NEXT_PUBLIC_HOSPITAL_ACCESS_TOKEN
        value: "085ceb8068750bccf73e8f76c71ef7de59092dada1f5f823"

databases:
  - name: unicare-db
    plan: free
    region: oregon
