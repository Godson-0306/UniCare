name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: unicare
          POSTGRES_USER: unicare
          POSTGRES_PASSWORD: unicare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unicare"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-secret
      DEBUG: "False"
      DATABASE_URL: postgres://unicare:unicare@localhost:5432/unicare
      REDIS_URL: redis://localhost:6379/0
      CHANNEL_LAYERS_REDIS_URL: redis://localhost:6379/1
      HOSPITAL_ACCESS_SECRET: ci-hospital-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt
      - run: python -m pip install -r requirements/development.txt
      - run: python manage.py migrate --noinput
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://127.0.0.1:8000
      NEXT_PUBLIC_HOSPITAL_ACCESS_TOKEN: ci-hospital-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
